<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgeCalc</title>
    <!-- Google Fonts - Nunito -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/main.css">
</head>

<body>
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-lg-6 col-md-8 col-12">
                <div class="card shadow-lg border-0 agecalc-card">
                    <div class="card-body p-5">
                        <!-- Header -->
                        <div class="text-center mb-4">
                            <i class="bi bi-calendar-heart display-1 text-primary mb-3"></i>
                            <h1 class="display-5 fw-bold text-dark mb-2">AgeCalc</h1>
                            <p class="text-muted">Discover your exact age in detail</p>
                        </div>

                        <!-- Input Section -->
                        <div class="mb-4">
                            <label for="birthDate" class="form-label fw-semibold">
                                <i class="bi bi-calendar-event me-2"></i>Select Your Birth Date
                            </label>
                            <input type="date" class="form-control form-control-lg" id="birthDate" required>
                            <div class="form-text">Choose the date you were born</div>
                        </div>

                        <!-- Calculate Button -->
                        <div class="d-grid mb-4">
                            <button type="button" class="btn btn-primary btn-lg" id="calculateBtn">
                                <i class="bi bi-calculator me-2"></i>Calculate Age
                            </button>
                        </div>

                        <!-- Results Section -->
                        <div id="results" class="d-none">
                            <hr class="my-4">
                            <h3 class="text-center mb-4 fw-bold">
                                <i class="bi bi-gift me-2 text-primary"></i>Your Age
                            </h3>

                            <!-- Main Age Display -->
                            <div class="row g-3 mb-4">
                                <div class="col-md-4">
                                    <div class="age-box text-center p-3 rounded">
                                        <div class="age-number" id="years">0</div>
                                        <div class="age-label">Years</div>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="age-box text-center p-3 rounded">
                                        <div class="age-number" id="months">0</div>
                                        <div class="age-label">Months</div>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="age-box text-center p-3 rounded">
                                        <div class="age-number" id="days">0</div>
                                        <div class="age-label">Days</div>
                                    </div>
                                </div>
                            </div>

                            <!-- Detailed Breakdown -->
                            <div class="detailed-breakdown">
                                <h5 class="mb-3 fw-semibold">
                                    <i class="bi bi-clock-history me-2"></i>Detailed Breakdown
                                </h5>
                                <div class="row g-2">
                                    <div class="col-6 col-md-3">
                                        <div class="detail-item p-2 rounded text-center">
                                            <div class="detail-value" id="totalDays">0</div>
                                            <div class="detail-label">Total Days</div>
                                        </div>
                                    </div>
                                    <div class="col-6 col-md-3">
                                        <div class="detail-item p-2 rounded text-center">
                                            <div class="detail-value" id="totalWeeks">0</div>
                                            <div class="detail-label">Weeks</div>
                                        </div>
                                    </div>
                                    <div class="col-6 col-md-3">
                                        <div class="detail-item p-2 rounded text-center">
                                            <div class="detail-value" id="totalHours">0</div>
                                            <div class="detail-label">Hours</div>
                                        </div>
                                    </div>
                                    <div class="col-6 col-md-3">
                                        <div class="detail-item p-2 rounded text-center">
                                            <div class="detail-value" id="totalMinutes">0</div>
                                            <div class="detail-label">Minutes</div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Next Birthday -->
                            <div class="next-birthday mt-4 p-3 rounded text-center">
                                <i class="bi bi-balloon me-2"></i>
                                <strong>Next Birthday:</strong> <span id="nextBirthday">-</span>
                            </div>
                        </div>

                        <!-- Error Message -->
                        <div id="errorMessage" class="alert alert-danger d-none mt-3" role="alert">
                            <i class="bi bi-exclamation-triangle me-2"></i>
                            <span id="errorText"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="assets/js/main.js"></script>
</body>

</html>
